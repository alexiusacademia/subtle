# Subtle's website: plain files, nothing to build.
#
# Author: Alexius Academia
# Date: 2026-11-23
[build]
  publish = "."

[[headers]]
  for = "/downloads.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
